plugins:
  - rubocop-minitest

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - tmp/**/*

Style/Documentation:
  Enabled: false

# 微分規則は「ノード種別 -> 規則」の対応表 (case) である。分割すると
# 対応表としての一覧性、つまり微分の定義そのものの読みやすさが壊れる。
# moissanite が oracle / emitter に同じ免除を与えているのと同じ理由。
Metrics/AbcSize:
  Max: 20
  Exclude:
    - test/**/*
    - examples/**/*
    - lib/nabla/forward.rb
    - lib/nabla/reverse.rb
    - lib/nabla/locals.rb
    - lib/nabla/emitter.rb
    - lib/nabla/simplify.rb
    - lib/nabla/integrate.rb
    - lib/nabla/verify.rb

Metrics/MethodLength:
  Max: 20
  Exclude:
    - test/**/*
    - examples/**/*
    - lib/nabla/forward.rb
    - lib/nabla/reverse.rb
    - lib/nabla/locals.rb

Metrics/CyclomaticComplexity:
  Exclude:
    - lib/nabla/forward.rb
    - lib/nabla/reverse.rb
    - lib/nabla/emitter.rb
    - lib/nabla/locals.rb
    - lib/nabla/dag.rb
    - lib/nabla/simplify.rb
    - lib/nabla/poly.rb
    - lib/nabla/integrate.rb
    - lib/nabla/rewrite.rb
    - examples/**/*

Metrics/PerceivedComplexity:
  Exclude:
    - lib/nabla/forward.rb
    - lib/nabla/reverse.rb
    - lib/nabla/emitter.rb
    - lib/nabla/locals.rb
    - lib/nabla/dag.rb
    - lib/nabla/simplify.rb
    - lib/nabla/poly.rb

Metrics/BlockLength:
  Exclude:
    - test/**/*
    - examples/**/*
    - "*.gemspec"

Metrics/ClassLength:
  Exclude:
    - test/**/*

Metrics/ModuleLength:
  Exclude:
    - lib/nabla/forward.rb
    - lib/nabla/reverse.rb
    - lib/nabla/simplify.rb
    - lib/nabla/integrate.rb

# 簡約器は式木の中の **リテラル** 1.0 / -1.0 / 0.0 を見分ける。これらは
# IEEE754 で厳密に表現される値なので、== による同定は正しい。近似比較に
# 置き換えると 0.9999999 を 1 と見なして式を書き換えてしまい、そちらが
# 誤りになる。
Lint/FloatComparison:
  Exclude:
    - lib/nabla/simplify.rb

# 3 個の位置引数 + 標本化の任意設定という形で、キーワード引数は既定値を
# 持つ調整つまみである。まとめてハッシュにすると呼び手から名前が消える。
Metrics/ParameterLists:
  CountKeywordArgs: false
  Exclude:
    - test/**/*
    - examples/**/*

# DSL の式に対する誤検出を止める: n > 0 は「数値の判定」ではなく
# 「bool 式ノードの構築」なので .positive? への書き換えは意味を壊す。
Style/NumericPredicate:
  Enabled: false

Naming/VariableNumber:
  AllowedIdentifiers:
    - f64
    - i64
    - f64_buf
    - i64_buf

Naming/MethodParameterName:
  AllowedNames:
    - k
    - x
    - y
    - w
    - g
    - n
    - o
    - at
    - fn
    - op
    - lo
    - hi

Minitest/MultipleAssertions:
  Exclude:
    - test/**/*
