name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # ubuntu runner には cc がいるので、導関数カーネルは native まで
      # 落ちる。oracle との差分検証がそこで初めて意味を持つ。
      - name: Run tests
        run: bundle exec rake test

      # backend を oracle に固定しても全テストが通る = 導関数が backend の
      # 都合ではなく式木の性質として正しいことの確認。
      - name: Run tests (oracle forced)
        run: bundle exec rake test
        env:
          MOISSANITE_BACKEND: oracle

      - name: Run examples
        run: bundle exec rake examples

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Build gem
        run: gem build nabla.gemspec

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"

      - name: Install Node dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check
